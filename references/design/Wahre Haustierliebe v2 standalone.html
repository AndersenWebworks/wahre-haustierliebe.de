document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

flecke */\n  --forest:    #1F3A2F;     /* tiefes Grün — Text und Anker */\n  --forest-2:  #2D4F3F;\n  --ink:       #1A2A22;\n  --ink-2:     #3D5046;\n  --ink-3:     #6B7F75;\n  --shadow-sm: 0 2px 8px rgba(31,58,47,0.08);\n  --shadow:    0 8px 28px rgba(31,58,47,0.10);\n  --shadow-lg: 0 18px 50px rgba(31,58,47,0.14);\n  --radius-sm: 12px;\n  --radius:    24px;\n  --radius-lg: 36px;\n  --max:       1240px;\n  --gutter:    clamp(20px, 5vw, 56px);\n  --display:   'Bricolage Grotesque', system-ui, sans-serif;\n  --body:      'Plus Jakarta Sans', system-ui, sans-serif;\n  --hand:      'Caveat', cursive;\n}\n\n* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: var(--body);\n  background: var(--cream);\n  color: var(--ink);\n  font-size: 17px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n}\n\nimg, svg { display: block; max-width: 100%; }\nbutton { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }\na { color: inherit; text-decoration: none; }\n\n/* Underline-Link */\na.link {\n  background-image: linear-gradient(to bottom, transparent 60%, rgba(255,138,107,0.35) 60%);\n  transition: background 0.2s ease;\n}\na.link:hover { background-image: linear-gradient(to bottom, transparent 0%, rgba(255,138,107,0.35) 0%); }\n\n.wrap   { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }\n.narrow { max-width: 820px; margin: 0 auto; padding: 0 var(--gutter); }\n\n/* Display headlines: Bricolage with tighter line-height */\n.h-display {\n  font-family: var(--display);\n  font-weight: 700;\n  line-height: 1.02;\n  letter-spacing: -0.025em;\n  color: var(--forest);\n}\n.h-display .it {\n  font-style: italic;\n  font-weight: 600;\n}\n.h-display .coral { color: var(--coral-dark); }\n.h-display .underline-coral {\n  position: relative;\n  display: inline-block;\n}\n.h-display .underline-coral::after {\n  content: \"\";\n  position: absolute;\n  left: 0; right: 0;\n  bottom: 0.08em;\n  height: 0.18em;\n  background: var(--coral);\n  z-index: -1;\n  border-radius: 4px;\n  opacity: 0.55;\n}\n\n/* Hand-written accent */\n.hand {\n  font-family: var(--hand);\n  font-weight: 600;\n  color: var(--coral-dark);\n}\n\n.eyebrow {\n  font-family: var(--body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--forest-2);\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n}\n.eyebrow .dot {\n  display: inline-block;\n  width: 8px; height: 8px; border-radius: 50%;\n  background: var(--coral);\n}\n\n/* Buttons */\n.btn {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 16px 28px;\n  border-radius: 999px;\n  font-family: var(--body);\n  font-weight: 700;\n  font-size: 16px;\n  transition: all 0.2s ease;\n  white-space: nowrap;\n}\n.btn-primary {\n  background: var(--forest);\n  color: var(--cream);\n  box-shadow: var(--shadow-sm);\n}\n.btn-primary:hover {\n  background: var(--coral-dark);\n  transform: translateY(-2px);\n  box-shadow: var(--shadow);\n}\n.btn-coral {\n  background: var(--coral);\n  color: var(--ink);\n}\n.btn-coral:hover {\n  background: var(--coral-dark);\n  color: var(--cream);\n  transform: translateY(-2px);\n}\n.btn-outline {\n  background: transparent;\n  color: var(--forest);\n  border: 2px solid var(--forest);\n}\n.btn-outline:hover {\n  background: var(--forest);\n  color: var(--cream);\n}\n.btn-white {\n  background: var(--cream);\n  color: var(--forest);\n  box-shadow: var(--shadow-sm);\n}\n.btn-white:hover {\n  background: var(--mint);\n  transform: translateY(-2px);\n}\n.btn .arr {\n  font-size: 18px;\n  transition: transform 0.2s ease;\n}\n.btn:hover .arr { transform: translateX(4px); }\n\n/* ============================================================\n   HEADER\n   ============================================================ */\nheader.site {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  background: rgba(251, 248, 242, 0.85);\n  backdrop-filter: saturate(140%) blur(10px);\n  -webkit-backdrop-filter: saturate(140%) blur(10px);\n  border-bottom: 1px solid rgba(31,58,47,0.08);\n}\n.site-inner {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 14px var(--gutter);\n  max-width: var(--max);\n  margin: 0 auto;\n}\n.brand {\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: 22px;\n  letter-spacing: -0.01em;\n  color: var(--forest);\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n.brand-emoji {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 36px; height: 36px;\n  background: var(--mint);\n  border-radius: 50%;\n  font-size: 18px;\n}\n.brand .h { color: var(--coral-dark); font-style: italic; }\n.site-nav {\n  display: flex;\n  gap: 28px;\n  align-items: center;\n  font-size: 15px;\n  color: var(--forest-2);\n  font-weight: 500;\n}\n.site-nav a:hover { color: var(--coral-dark); }\n.site-nav .nav-cta {\n  padding: 10px 20px;\n  background: var(--coral);\n  color: var(--ink);\n  border-radius: 999px;\n  font-weight: 700;\n}\n.site-nav .nav-cta:hover { background: var(--coral-dark); color: var(--cream); }\n@media (max-width: 840px) {\n  .site-nav a:not(.nav-cta) { display: none; }\n}\n\n/* ============================================================\n   HERO\n   ============================================================ */\n.hero {\n  background: var(--mint);\n  padding: clamp(56px, 9vh, 100px) 0 clamp(80px, 11vh, 130px);\n  position: relative;\n  overflow: hidden;\n}\n.hero::before {\n  content: \"🐾\";\n  position: absolute;\n  font-size: 240px;\n  top: 60%;\n  right: -40px;\n  transform: rotate(-15deg);\n  opacity: 0.07;\n  pointer-events: none;\n}\n.hero-grid {\n  display: grid;\n  grid-template-columns: 1.1fr 1fr;\n  gap: clamp(28px, 5vw, 80px);\n  align-items: center;\n}\n.hero-text .eyebrow { margin-bottom: 24px; }\n.hero-text .eyebrow .dot { background: var(--forest); }\n.hero-title {\n  font-family: var(--display);\n  font-weight: 800;\n  font-size: clamp(48px, 8vw, 108px);\n  line-height: 0.96;\n  letter-spacing: -0.03em;\n  color: var(--forest);\n  margin-bottom: 28px;\n}\n.hero-title .qmark { color: var(--coral-dark); }\n.hero-title .em {\n  font-style: italic;\n  font-weight: 700;\n  position: relative;\n  display: inline-block;\n}\n.hero-title .em::after {\n  content: \"\";\n  position: absolute;\n  left: -2%; right: -2%;\n  bottom: 0.06em;\n  height: 0.22em;\n  background: var(--coral);\n  z-index: -1;\n  border-radius: 6px;\n  opacity: 0.55;\n  transform: rotate(-1deg);\n}\n.hero-sub {\n  font-size: clamp(18px, 1.8vw, 22px);\n  line-height: 1.55;\n  color: var(--forest-2);\n  margin-bottom: 36px;\n  max-width: 520px;\n}\n.hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; }\n.hero-mini-fact {\n  margin-top: 36px;\n  display: inline-flex;\n  align-items: center;\n  gap: 14px;\n  background: rgba(31,58,47,0.06);\n  padding: 12px 20px;\n  border-radius: 999px;\n  font-size: 14px;\n  color: var(--forest);\n}\n.hero-mini-fact .num {\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: 18px;\n  color: var(--coral-dark);\n}\n\n.hero-photo {\n  position: relative;\n}\n.hero-photo image-slot {\n  display: block;\n  width: 100%;\n  height: auto;\n  aspect-ratio: 4 / 5;\n  box-shadow: var(--shadow-lg);\n}\n.hero-photo .tape {\n  position: absolute;\n  top: -14px;\n  left: 20px;\n  background: var(--sun);\n  padding: 6px 22px;\n  font-family: var(--hand);\n  font-size: 22px;\n  color: var(--ink);\n  transform: rotate(-3deg);\n  box-shadow: var(--shadow-sm);\n  border-radius: 6px;\n  z-index: 2;\n}\n.hero-photo .badge {\n  position: absolute;\n  bottom: -28px;\n  right: -20px;\n  background: var(--cream);\n  padding: 18px 22px;\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  max-width: 240px;\n}\n.hero-photo .badge .emoji {\n  font-size: 32px;\n}\n.hero-photo .badge .text {\n  font-family: var(--display);\n  font-size: 14px;\n  font-weight: 600;\n  color: var(--forest);\n  line-height: 1.3;\n}\n\n@media (max-width: 900px) {\n  .hero-grid { grid-template-columns: 1fr; gap: 56px; }\n  .hero-photo { max-width: 460px; margin: 0 auto; width: 100%; }\n}\n\n/* ============================================================\n   STATS BAR\n   ============================================================ */\n.stats {\n  background: var(--cream);\n  padding: clamp(60px, 8vh, 90px) 0;\n}\n.stats-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 20px;\n}\n.stat-card {\n  background: var(--cream-2);\n  border-radius: var(--radius);\n  padding: 32px 28px;\n  text-align: center;\n  border: 2px solid transparent;\n  transition: all 0.2s ease;\n}\n.stat-card:hover {\n  border-color: var(--coral);\n  transform: translateY(-3px);\n  box-shadow: var(--shadow);\n}\n.stat-card .emoji { font-size: 32px; margin-bottom: 14px; display: block; }\n.stat-card .num {\n  font-family: var(--display);\n  font-weight: 800;\n  font-size: clamp(40px, 6vw, 60px);\n  line-height: 0.95;\n  color: var(--forest);\n  letter-spacing: -0.02em;\n  margin-bottom: 12px;\n}\n.stat-card .num .unit { font-size: 0.5em; color: var(--coral-dark); }\n.stat-card .label {\n  font-size: 14px;\n  color: var(--forest-2);\n  line-height: 1.5;\n  max-width: 28ch;\n  margin: 0 auto;\n}\n@media (max-width: 780px) { .stats-grid { grid-template-columns: 1fr; } }\n\n/* ============================================================\n   MANIFESTO\n   ============================================================ */\n.manifesto {\n  padding: clamp(80px, 12vh, 130px) 0;\n  text-align: center;\n}\n.manifesto h2 {\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: clamp(36px, 5.5vw, 72px);\n  line-height: 1.05;\n  letter-spacing: -0.02em;\n  color: var(--forest);\n  margin: 24px auto 28px;\n  max-width: 18ch;\n}\n.manifesto h2 .em {\n  font-style: italic;\n  position: relative;\n  display: inline-block;\n  color: var(--coral-dark);\n}\n.manifesto h2 .em::after {\n  content: \"\";\n  position: absolute;\n  left: -3%; right: -3%;\n  bottom: 0.08em;\n  height: 0.2em;\n  background: var(--coral);\n  z-index: -1;\n  border-radius: 6px;\n  opacity: 0.4;\n}\n.manifesto p {\n  font-size: clamp(18px, 2vw, 22px);\n  line-height: 1.6;\n  color: var(--ink-2);\n  max-width: 680px;\n  margin: 0 auto 18px;\n}\n.manifesto .sign {\n  margin-top: 36px;\n  font-family: var(--hand);\n  font-size: 26px;\n  color: var(--forest-2);\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n}\n\n/* ============================================================\n   ARGUMENT CARDS — the \"Was du meinst / Was es erlebt\" deck\n   ============================================================ */\n.arguments {\n  background: var(--mint-bg);\n  padding: clamp(80px, 12vh, 130px) 0;\n}\n.arg-head {\n  text-align: center;\n  margin-bottom: 60px;\n  max-width: 800px;\n  margin-left: auto;\n  margin-right: auto;\n}\n.arg-head h2 {\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: clamp(36px, 5.5vw, 64px);\n  line-height: 1.05;\n  letter-spacing: -0.02em;\n  color: var(--forest);\n  margin: 20px 0 18px;\n}\n.arg-head h2 .em {\n  font-style: italic;\n  color: var(--coral-dark);\n}\n.arg-head p {\n  font-size: 18px;\n  line-height: 1.55;\n  color: var(--ink-2);\n}\n\n.arg-cards {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 24px;\n}\n.arg-card {\n  background: var(--cream);\n  border-radius: var(--radius);\n  padding: 32px;\n  box-shadow: var(--shadow-sm);\n  transition: all 0.25s ease;\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  cursor: pointer;\n  border: 2px solid transparent;\n}\n.arg-card:hover {\n  transform: translateY(-4px);\n  box-shadow: var(--shadow);\n  border-color: var(--mint-dark);\n}\n.arg-card.open {\n  border-color: var(--coral);\n}\n.arg-card .quote-emoji {\n  font-family: var(--display);\n  font-size: 56px;\n  line-height: 0.4;\n  color: var(--mint-dark);\n  margin-bottom: 8px;\n  height: 32px;\n}\n.arg-card .claim {\n  font-family: var(--display);\n  font-weight: 600;\n  font-size: clamp(22px, 2.4vw, 28px);\n  line-height: 1.18;\n  letter-spacing: -0.015em;\n  color: var(--forest);\n  margin-bottom: 20px;\n}\n.arg-card .claim .em { font-style: italic; }\n.arg-card .toggle-row {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 14px;\n  margin-top: auto;\n}\n.arg-card .toggle-text {\n  font-size: 14px;\n  font-weight: 600;\n  color: var(--coral-dark);\n}\n.arg-card .toggle-btn {\n  width: 36px; height: 36px;\n  border-radius: 50%;\n  background: var(--mint);\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 20px;\n  font-weight: 700;\n  color: var(--forest);\n  transition: all 0.25s ease;\n}\n.arg-card:hover .toggle-btn { background: var(--coral); }\n.arg-card.open .toggle-btn { transform: rotate(45deg); background: var(--coral); color: var(--cream); }\n.arg-card .reveal {\n  max-height: 0;\n  overflow: hidden;\n  transition: max-height 0.5s ease, margin 0.4s ease, opacity 0.4s ease;\n  opacity: 0;\n}\n.arg-card.open .reveal {\n  max-height: 600px;\n  margin-top: 24px;\n  opacity: 1;\n}\n.arg-card .layer {\n  padding: 16px 18px;\n  border-radius: var(--radius-sm);\n  margin-bottom: 12px;\n}\n.arg-card .layer-label {\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  margin-bottom: 6px;\n}\n.arg-card .layer p {\n  font-size: 15px;\n  line-height: 1.5;\n  color: var(--ink);\n}\n.arg-card .layer.you {\n  background: var(--cream-2);\n}\n.arg-card .layer.you .layer-label { color: var(--ink-3); }\n.arg-card .layer.real {\n  background: var(--mint-bg);\n}\n.arg-card .layer.real .layer-label { color: var(--forest-2); }\n.arg-card .layer.honest {\n  background: rgba(255,138,107,0.16);\n}\n.arg-card .layer.honest .layer-label { color: var(--coral-dark); }\n.arg-card .layer.honest p { font-weight: 600; }\n.arg-card .share-row {\n  display: flex;\n  gap: 10px;\n  margin-top: 18px;\n  align-items: center;\n  flex-wrap: wrap;\n}\n.arg-card .share-row span {\n  font-size: 12px;\n  color: var(--ink-3);\n  font-weight: 600;\n}\n.arg-card .share-row .mini {\n  font-size: 13px;\n  padding: 8px 14px;\n  background: var(--cream-2);\n  border-radius: 999px;\n  color: var(--forest);\n  font-weight: 600;\n  transition: all 0.2s ease;\n}\n.arg-card .share-row .mini:hover {\n  background: var(--coral);\n  color: var(--cream);\n}\n\n@media (max-width: 760px) {\n  .arg-cards { grid-template-columns: 1fr; }\n}\n\n/* ============================================================\n   TEST TEASER — Bist du bereit?\n   ============================================================ */\n.test {\n  padding: clamp(80px, 12vh, 130px) 0;\n}\n.test-card {\n  background: var(--forest);\n  color: var(--cream);\n  border-radius: var(--radius-lg);\n  padding: clamp(40px, 6vw, 80px);\n  position: relative;\n  overflow: hidden;\n  display: grid;\n  grid-template-columns: 1.2fr 1fr;\n  gap: clamp(28px, 4vw, 60px);\n  align-items: center;\n}\n.test-card::before {\n  content: \"✨\";\n  position: absolute;\n  font-size: 200px;\n  top: -40px;\n  right: -20px;\n  opacity: 0.06;\n  pointer-events: none;\n}\n.test-card .eyebrow {\n  color: var(--mint);\n  margin-bottom: 18px;\n}\n.test-card .eyebrow .dot { background: var(--coral); }\n.test-card h2 {\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: clamp(40px, 6vw, 72px);\n  line-height: 1;\n  letter-spacing: -0.025em;\n  color: var(--cream);\n  margin-bottom: 22px;\n}\n.test-card h2 .em {\n  color: var(--mint);\n  font-style: italic;\n}\n.test-card p {\n  font-size: 18px;\n  line-height: 1.55;\n  color: rgba(251,248,242,0.85);\n  margin-bottom: 32px;\n  max-width: 460px;\n} katzen.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat-card\">\n        <span class=\"emoji\">🐾<\u002Fspan>\n        <div class=\"num\">46<span class=\"unit\"> %<\u002Fspan><\u002Fdiv>\n        <div class=\"label\">der Haushalte halten Haustiere. Aber wie viele davon halten sie wirklich artgerecht?<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ -->\n<!-- MANIFESTO                                                    -->\n<!-- ============================================================ -->\n<section class=\"manifesto\">\n  <div class=\"narrow\">\n    <span class=\"eyebrow\"><span class=\"dot\"><\u002Fspan> Warum diese Seite<\u002Fspan>\n    <h2>Gute Absichten <br>reichen <span class=\"em\">nicht<\u002Fspan>.<\u002Fh2>\n    <p>\n      Wir gehen davon aus, dass jeder Mensch, der ein Tier hält, das Beste für dieses Tier will.\n      Wenn es trotzdem schiefläuft, liegt das nicht an bösem Willen — sondern an fehlenden Informationen.\n    <\u002Fp>\n    <p>\n      Diese Seite liefert sie. Ehrlich. Manchmal unbequem. Aber immer im Sinne der Tiere.\n    <\u002Fp>\n    <div class=\"sign\">— zwei Tierfreunde aus Mecklenburg-Vorpommern 🐾<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ -->\n<!-- ARGUMENT CARDS                                               -->\n<!-- ============================================================ -->\n<section class=\"arguments\" id=\"argumente\">\n  <div class=\"wrap\">\n    <div class=\"arg-head\">\n      <span class=\"eyebrow\"><span class=\"dot\"><\u002Fspan> Die Sätze, die wir uns erzählen<\u002Fspan>\n      <h2>Was du <em class=\"em\">meinst<\u002Fem>. Was dein Tier <em class=\"em\">erlebt<\u002Fem>.<\u002Fh2>\n      <p>\n        Wir alle sagen Dinge, um schwierige Entscheidungen zu rechtfertigen. Das ist menschlich. Bei Tieren hat es Folgen.\n        Klick auf eine Karte, um ggle-btn\">+<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"reveal\">\n          <div class=\"layer you\">\n            <div class=\"layer-label\">😊 Was du meinst<\u002Fdiv>\n            <p>Ein Welpe ist ein unbeschriebenes Blatt. Ein Tierheimtier kommt mit „Gepäck\". Du willst es richtig machen.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"layer real\">\n            <div class=\"layer-label\">🐶 Die Realität<\u002Fdiv>\n            <p>Die meisten Tierheimtiere sind dort, weil Menschen versagt haben — nicht die Tiere. Scheidung, Umzug, Überforderung.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"layer honest\">\n            <div class=\"layer-label\">💡 Der Unterschied<\u002Fdiv>\n            <p>Beim Züchter kaufst du ein <em>Versprechen<\u002Fem>. Im Tierheim lernst du ein Tier <em>kennen<\u002Fem>.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"share-row\">\n            <span>Teilen:<\u002Fspan>\n            <button class=\"mini\" onclick=\"shareArg(2,'whatsapp')\">WhatsApp<\u002Fbutton>\n            <button class=\"mini\" onclick=\"shareArg(2,'image')\">🖼 Bildkarte<\u002Fbutton>\n            <button class=\"mini\" onclick=\"shareArg(2,'copy')\">Link<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"arg-card\">\n        <div class=\"quote-emoji\">\"<\u002Fdiv>\n        <div class=\"claim\">Der Hund kann ja im <span class=\"em\">Garten<\u002Fspan> bleiben.<\u002Fdiv>\n        <div class=\"toggle-row\">\n          <span class=\"toggle-text\">Warum ein Garten nicht reicht<\u002Fspan>\n          <span class=\"toggle-btn\">+<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"reveal\">\n          <div class=\"layer you\">\n            <div class=\"layer-label\">😊 Was du meinst<\u002Fdiv>\n            <p>Platz gleich Auslastung. Großer Garten gleich glücklicher Hund. Eine schöne Vorstellung.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"layer real\">\n            <div class=\"layer-label\">🐕 Was dein Hund erlebt<\u002Fdiv>\n            <p>Er kennt jeden Grashalm nach einer Woche. Er wartet. Er braucht keine Quadratmeter — er braucht <em>dich<\u002Fem>.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"layer honest\">\n            <div class=\"layer-label\">💡 Die ehrliche Frage<\u002Fdiv>\n            <p>Wäre ein Garten ein Ersatz für deine Zeit? Dann passt ein Hund gerade nicht zu deinem Leben.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"share-row\">\n            <span>Teilen:<\u002Fspan>\n            <button class=\"mini\" onclick=\"shareArg(3,'whatsapp')\">WhatsApp<\u002Fbutton>\n            <button class=\"mini\" onclick=\"shareArg(3,'image')\">🖼 Bildkarte<\u002Fbutton>\n            <button class=\"mini\" onclick=\"shareArg(3,'copy')\">Link<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"arg-card\">\n        <div class=\"quote-emoji\">\"<\u002Fdiv>\n        <div class=\"claim\">Ein einzelner Wellensittich wird <span class=\"em\">zahmer<\u002Fspan>.<\u002Fdiv>\n        <div class=\"toggle-row\">\n          <span class=\"toggle-text\">Was wirklich passiert<\u002Fspan>\n          <span class=\"toggle-btn\">+<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"reveal\">\n          <div class=\"layer you\">\n            <div class=\"layer-label\">😊 Was du meinst<\u002Fdiv>\n            <p>Ein Vogel ohne Artgenosse sucht den Menschen als Bezugspunkt. Er wird zutraulich. Er „spricht\".<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"layer real\">\n            <div class=\"layer-label\">🦜 Was dein Vogel erlebt<\u002Fdiv>\n            <p>Ein Hilferuf, kein Partytrick. Kontaktrufe in eine leere Wohnung. Federrupfen. Chronischer Stress.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"layer honest\">\n            <div class=\"layer-label\">💡 Die ehrliche Frage<\u002Fdiv>\n            <p>Willst du einen Vogel — oder eine kleine, zahme Projektion deiner selbst?<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"share-row\">\n            <span>Teilen:<\u002Fspan>\n            <button class=\"mini\" onclick=\"shareArg(4,'whatsapp')\">WhatsApp<\u002Fbutton>\n            <button class=\"mini\" onclick=\"shareArg(4,'image')\">🖼 Bildkarte<\u002Fbutton>\n            <button class=\"mini\" onclick=\"shareArg(4,'copy')\">Link<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ -->\n<!-- SELBSTTEST TEASER                                            -->\n<!-- ============================================================ -->\n<section class=\"test\" id=\"test\">\n  <div class=\"wrap\">\n    <div class=\"test-card\">\n      <div>\n        <span class=\"eyebrow\"><span class=\"dot\"><\u002Fspan> Selbsttest · 60 Sekunden · 15 Fragen<\u002Fspan>\n        <h2>Bist du <span class=\"em\">bereit<\u002Fspan><br>für ein Tier?<\u002Fh2>\n        <p>\n          Keine Moralkeule. Aber auch kein Schönreden.\n          Antworte ehrlich — so, wie dein Leben wirklich aussieht.\n          Am Ende: ein ehrliches Bild, kein Urteil.\n        <\u002Fp>\n        <a href=\"#\" class=\"btn btn-coral\" onclick=\"alert('In der Vollversion: 15-Fragen-Selbsttest mit Auswertung'); return false;\">\n          ✨ Test starten <span class=\"arr\">→<\u002Fspan>\n        <\u002Fa>\n        <div class=\"test-meta\">\n          <span><strong>15<\u002Fstrong> ehrliche Fragen<\u002Fspan>\n          <span><strong>60<\u002Fstrong> Sek.<\u002Fspan>\n          <span><strong>0<\u002Fstrong> Urteil<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"test-stamp\">\n        <div class=\"ring\">\n          <span class=\"small\">Ehrlich.<\u002Fspan>\n          <span class=\"big\">Du. Dein Tier.<br>Eure Zukunft.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ -->\n<!-- TIERARTEN                                                    -->\n<!-- ============================================================ -->\n<section class=\"tiere\" id=\"tiere\">\n  <div class=\"wrap\">\n    <div class=\"tiere-head\">\n      <div>\n        <span class=\"eyebrow\"><span class=\"dot\"><\u002Fspan> Die Wahrheit über Haustiere<\u002Fspan>\n        <h2>Was jede Tierart <em class=\"em\">wirklich<\u002Fem> braucht.<\u002Fh2>\n      <\u002Fdiv>\n      <p>Sechs Kapitel. Sechs Wahrheiten. Mit ehrlichen Kosten, häufigen Fehlern — und der einen Frage, die sich keiner stellt.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"tier-grid\">\n      <a class=\"tier-card\" href=\"#hunde\">\n        <span class=\"emoji-tag\">🐶<\u002Fspan>\n        <image-slot id=\"tier-hund\" placeholder=\"Foto: Hund\" shape=\"rect\"><\u002Fimage-slot>\n        <div class=\"body\">\n          <h3>Hunde<\u002Fh3>\n          <p>Ein Hund im Garten ist <span class=\"em\">ein Hund, der wartet<\u002Fspan>. Bewegung allein reicht nicht.<\u002Fp>\n          <span class=\"more\">Mehr erfahren <span class=\"arr\">→<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a class=\"tier-card\" href=\"#katzen\">\n        <span class=\"emoji-tag\">🐱<\u002Fspan>\n        <image-slot id=\"tier-katze\" placeholder=\"Foto: Katze\" shape=\"rect\"><\u002Fimage-slot>\n        <div class=\"body\">\n          <h3>Katzen<\u002Fh3>\n          <p>Einzeljäger, aber <span class=\"em\">keine Einzelgänger<\u002Fspan>. Stille kann Krankheit sein.<\u002Fp>\n          <span class=\"more\">Mehr erfahren <span class=\"arr\">→<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a class=\"tier-card\" href=\"#voegel\">\n        <span class=\"emoji-tag\">🦜<\u002Fspan>\n        <image-slot id=\"tier-vogel\" placeholder=\"Foto: Wellensittich\" shape=\"rect\"><\u002Fimage-slot>\n        <div class=\"body\">\n          <h3>Vögel<\u002Fh3>\n          <p>Schwarmtiere. <span class=\"em\">Ein<\u002Fspan> Vogel allein im Käfig ist kein Haustier.<\u002Fp>\n          <span class=\"more\">Mehr erfahren <span class=\"arr\">→<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a class=\"tier-card\" href=\"#kleintiere\">\n        <span class=\"emoji-tag\">🐰<\u002Fspan>\n        <image-slot id=\"tier-kanin\" placeholder=\"Foto: Kaninchen\" shape=\"rect\"><\u002Fimage-slot>\n        <div class=\"body\">\n          <h3>Kleintiere<\u002Fh3>\n          <p>Kein Einstiegstier. <span class=\"em\">Kein Kinderspielzeug<\u002Fspan>. Fast immer falsch gehalten.<\u002Fp>\n          <span class=\"more\">Mehr erfahren <span class=\"arr\">→<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a class=\"tier-card\" href=\"#exoten\">\n        <span class=\"emoji-tag\">🦎<\u002Fspan>\n        <image-slot id=\"tier-exot\" placeholder=\"Foto: Reptil\" shape=\"rect\"><\u002Fimage-slot>\n        <div class=\"body\">\n          <h3>Exoten<\u002Fh3>\n          <p>Sie machen nichts kaputt — sie <span class=\"em\">sterben leise<\u002Fspan>, wenn die Haltung nicht stimmt.<\u002Fp>\n          <span class=\"more\">Mehr erfahren <span class=\"arr\">→<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a class=\"tier-card\" href=\"#pferde\">\n        <span class=\"emoji-tag\">🐴<\u002Fspan>\n        <image-slot id=\"tier-pferd\" placeholder=\"Foto: Pferd\" shape=\"rect\"><\u002Fimage-slot>\n        <div class=\"body\">\n          <h3>Pferde<\u002Fh3>\n          <p>Eine Koppel ist <span class=\"em\">nicht<\u002Fspan> genug. Herdentiere, nie Solisten.<\u002Fp>\n          <span class=\"more\">Mehr erfahren <span class=\"arr\">→<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ -->\n<!-- ADOPT DON'T SHOP                                             -->\n<!-- ============================================================ -->\n<section class=\"adopt\">\n  <div class=\"wrap adopt-grid\">\n    <div class=\"adopt-text\">\n      <span class=\"eyebrow\"><span class=\"dot\"><\u002Fspan> Adopt, don't shop<\u002Fspan>\n      <h2>Dein Traumtier <span class=\"it\">wartet schon<\u002Fspan>.<\u002Fh2>\n      <p>\n        In deutschen Tierheimen leben über <strong>350.000 Tiere<\u002Fstrong> pro Jahr — Hunde, Katzen, Kaninchen, Vögel.\n        In jedem Alter, jeder Größe, jedem Charakter. Schon kastriert, geimpft, gechippt.\n      <\u002Fp>\n      <p>\n        Solange die Tierheime voll sind, ist jedes gezüchtete Tier eines zu viel.\n        Auch beim seriösen Züchter.\n      <\u002Fp>\n      <div class=\"hero-ctas\">\n        <a href=\"#adoption\" class=\"btn btn-primary\">🏠 Adoption verstehen <span class=\"arr\">→<\u002Fspan><\u002Fa>\n        <a href=\"#qualzucht\" class=\"btn btn-white\">⚠️ Qualzucht erkennen<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"adopt-photo\">\n      <image-slot id=\"adopt-photo\" placeholder=\"🐶 Foto eines Tierheimtieres\" shape=\"rounded\" radius=\"24\"><\u002Fimage-slot>\n      <div class=\"hand-note\">Adoptiere keinen Hund.<br>Adoptiere <em>einen Freund.<\u002Fem><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ -->\n<!-- STREUNERHILFE                                                -->\n<!-- ============================================================ -->\n<section class=\"streuner\" id=\"streuner\">\n  <div class=\"wrap\">\n    <div class=\"streuner-card\">\n      <div class=\"streuner-image\">\n        <image-slot id=\"streuner-photo\" placeholder=\"🐱 Foto: Streunerkatze\" shape=\"rounded\" radius=\"24\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div class=\"streuner-text\">\n        <span class=\"eyebrow\"><span class=\"dot\"><\u002Fspan> Lokal · Ehrenamtlich · Wirksam<\u002Fspan>\n        <h2>Streunerhilfe <em class=\"em\">Plau<\u002Fem> e. V.<\u002Fh2>\n        <p>\n          Eine Handvoll Ehrenamtlicher in Mecklenburg-Vorpommern kümmert sich um Streunerkatzen\n          in Plau, Goldberg, Karow — vor Ort, mit Geduld, ohne Lobby.\n        <\u002Fp>\n        <div class=\"streuner-numbers\">\n          <div class=\"item\"><div class=\"n\">86<\u002Fdiv><div class=\"l\">Katzen versorgt<\u002Fdiv><\u002Fdiv>\n          <div class=\"item\"><div class=\"n\">48<\u002Fdiv><div class=\"l\">kastriert<\u002Fdiv><\u002Fdiv>\n          <div class=\"item\"><div class=\"n\">74<\u002Fdiv><div class=\"l\">vermittelt<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 14px; color: var(--ink-3);\">\n          Diese Seite ist privat und werbefrei. Spenden an uns sind nicht steuerlich absetzbar —\n          eine Spende an die Streunerhilfe schon. Und sie wirkt direkt.\n        <\u002Fp>\n        <div class=\"streuner-ctas\">\n          <a href=\"https://streunerhilfe-plau.de/spenden\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\">💚 Jetzt spenden <span class=\"arr\">→<\u002Fspan><\u002Fa>\n          <a href=\"https://streunerhilfe-plau.de\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-outline\">Mehr über den Verein<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ -->\n<!-- SHARE BANNER                                                 -->\n<!-- ============================================================ -->\n<section class=\"share-banner\" id=\"teilen\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\"><span class=\"dot\"><\u002Fspan> Die wichtigste Aktion<\u002Fspan>\n    <h2>Schick es jemandem,<br>der es <em class=\"em-coral\">lesen sollte<\u002Fem>.<\u002Fh2>\n    <p>Aufklärung verbreitet sich nicht durch Empörung. Sondern durch geduldige Weitergabe.<\u002Fp>\n    <div class=\"share-buttons\">\n      <button class=\"share-btn primary\" onclick=\"share('whatsapp')\">💬 WhatsApp<\u002Fbutton>\n      <button class=\"share-btn\" onclick=\"share('facebook')\">📘 Facebook<\u002Fbutton>\n      <button class=\"share-btn\" onclick=\"share('email')\">✉️ E-Mail<\u002Fbutton>\n      <button class=\"share-btn\" onclick=\"share('copy')\">🔗 Link kopieren<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ -->\n<!-- FOOTER                                                       -->\n<!-- ============================================================ -->\n<footer class=\"site\">\n  <div class=\"wrap\">\n    <div class=\"foot-inner\">\n      <div class=\"foot-brand\">\n        <div class=\"brand\">\n          <span class=\"brand-emoji\">🐾<\u002Fspan>\n          <span>Wa<span class=\"h\">(h)<\u002Fspan>re Haustierliebe<\u002Fspan>\n        <\u002Fdiv>\n        <p>Ehrliche Aufklärung über Tierhaltung. Ein privates Projekt aus Mecklenburg-Vorpommern. Werbefrei, unabhängig, anonym.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h4>Beratung<\u002Fh4>\n        <a href=\"#test\">Bin ich bereit?<\u002Fa>\n        <a href=\"#argumente\">Mythen &amp; Sätze<\u002Fa>\n        <a href=\"#adoption\">Adoption<\u002Fa>\n        <a href=\"#qualzucht\">Qualzucht<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h4>Tierarten<\u002Fh4>\n        <a href=\"#hunde\">Hunde<\u002Fa>\n        <a href=\"#katzen\">Katzen<\u002Fa>\n        <a href=\"#kleintiere\">Kleintiere<\u002Fa>\n        <a href=\"#voegel\">Vögel &amp; Exoten<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-bottom\">\n      <span>Mit <span class=\"foot-heart\">💕<\u002Fspan> für alle Tiere gemacht. Diese Seite ersetzt keine tierärztliche Beratung.<\u002Fspan>\n      <span><a href=\"#\">Impressum<\u002Fa> · <a href=\"#\">Datenschutz<\u002Fa><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- Toast -->\n<div class=\"toast\" id=\"toast\">Link kopiert! 💚<\u002Fdiv>\n\n\n\n<!-- Image slot component -->\n<script src=\"33878248-b568-422b-8f6f-c20d93351800\"><\u002Fscript>\n\n<!-- Interactions -->\n<script>\n// Argument cards open/close\ndocument.querySelectorAll('.arg-card').forEach(card => {\n  // Only the toggle row triggers, not share buttons\n  const triggers = card.querySelectorAll('.quote-emoji, .claim, .toggle-row');\n  triggers.forEach(t => {\n    t.addEventListener('click', (e) => {\n      if (e.target.closest('.share-row')) return;\n      card.classList.toggle('open');\n    });\n  });\n});\n\n// Share-row click guard\ndocument.querySelectorAll('.arg-card .share-row').forEach(s => {\n  s.addEventListener('click', e => e.stopPropagation());\n});\n\n// Toast\nfunction toast(msg) {\n  const el = document.getElementById('toast');\n  el.textContent = msg;\n  el.classList.add('show');\n  clearTimeout(window.__t);\n  window.__t = setTimeout(() => el.classList.remove('show'), 2200);\n}\n\n// Share argument\nfunction shareArg(num, method) {\n  const url = 'https://wahre-haustierliebe.de#argument-' + num;\n  if (method === 'whatsapp') window.open('https://wa.me/?text=' + encodeURIComponent(url), '_blank');\n  else if (method === 'copy') navigator.clipboard.writeText(url).then(() => toast('Link kopiert! 💚'));\n  else toast('🖼 Bildkarte wird generiert …');\n}\n\n// Generic share\nfunction share(method) {\n  const url = 'https://wahre-haustierliebe.de';\n  const text = 'Wa(h)re Haustierliebe — ehrliche Aufklärung über Tierhaltung. 🐾';\n  if (method === 'whatsapp') window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank');\n  else if (method === 'facebook') window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), '_blank');\n  else if (method === 'email')    window.location.href = 'mailto:?subject=' + encodeURIComponent('Wa(h)re Haustierliebe') + '&body=' + encodeURIComponent(text + '\\n\\n' + url);\n  else if (method === 'copy')     navigator.clipboard.writeText(url).then(() => toast('Link kopiert! 💚'));\n}\n\n// Reveal on scroll\nconst io = new IntersectionObserver((entries) => {\n  entries.forEach(e => {\n    if (e.isIntersecting) {\n      e.target.classList.add('in');\n      io.unobserve(e.target);\n    }\n  });\n}, { threshold: 0.12 });\ndocument.querySelectorAll('.reveal').forEach(el => io.observe(el));\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
